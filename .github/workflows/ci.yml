name: CI

# O guardrail de conformidade só protege de fato se rodar sem depender de
# alguém lembrar. É este arquivo que torna verdadeira a frase "texto com juízo
# de valor quebra o CI" que está em docs/COMPLIANCE.md.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes e guardrail de conformidade
        run: npm test

      - name: Build
        run: npm run build
